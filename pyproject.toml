[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnscan"
version = "1.0.0"
description = "A simple, educational network vulnerability scanner (port scanning, service fingerprinting, and reporting)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abhay Jadon", email = "jadonabhay574@gmail.com" }]
keywords = ["security", "port-scanner", "vulnerability", "pentest", "networking"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/abhay528/vulnscan"
Issues = "https://github.com/abhay528/vulnscan/issues"

[project.scripts]
vulnscan = "vulnscan.cli:main"

[tool.setuptools.packages.find]
include = ["vulnscan*"]

[tool.setuptools.package-data]
vulnscan = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
